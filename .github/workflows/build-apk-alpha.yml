name: Build Compose APK (Alpha)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Unit tests
        run: >
          ./gradlew
          :core:common:testAndroidHostTest
          :core:network:testAndroidHostTest
          :core:database:testAndroidHostTest
          :shared:testAndroidHostTest
          :app:testAlphaDebugUnitTest

      - name: Decode signing keystore
        if: ${{ secrets.AS_KEYSTORE_BASE64 != '' }}
        env:
          AS_KEYSTORE_BASE64: ${{ secrets.AS_KEYSTORE_BASE64 }}
        run: |
          echo "$AS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/as-release.jks"
          echo "AS_KEYSTORE_FILE=$RUNNER_TEMP/as-release.jks" >> "$GITHUB_ENV"

      - name: Assemble alphaRelease
        env:
          AS_KEYSTORE_PASSWORD: ${{ secrets.AS_KEYSTORE_PASSWORD }}
          AS_KEY_ALIAS: ${{ secrets.AS_KEY_ALIAS }}
          AS_KEY_PASSWORD: ${{ secrets.AS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleAlphaRelease --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilibilias-alpha-release
          path: app/build/outputs/apk/alpha/release/*.apk