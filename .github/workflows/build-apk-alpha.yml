name: Build Compose APK (Alpha)

# 仅手动触发：上游因 DMCA 归档，本仓库保持"不公开发布 APK"的口径，
# 不在每次 push 留下自动构建痕迹，也不上传任何可下载产物
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Unit tests
        run: >
          ./gradlew
          :core:common:testAndroidHostTest
          :core:network:testAndroidHostTest
          :core:database:testAndroidHostTest
          :shared:testAndroidHostTest
          :app:testAlphaDebugUnitTest

      # secrets 上下文不能出现在 if: 表达式里（workflow 校验会直接失败），
      # 因此用步骤内 shell 判空实现“未配置则跳过”
      - name: Decode signing keystore
        env:
          AS_KEYSTORE_BASE64: ${{ secrets.AS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AS_KEYSTORE_BASE64" ]; then
            echo "AS_KEYSTORE_BASE64 未配置，跳过解码，构建将回退 debug 签名"
            exit 0
          fi
          echo "$AS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/as-release.jks"
          echo "AS_KEYSTORE_FILE=$RUNNER_TEMP/as-release.jks" >> "$GITHUB_ENV"

      - name: Assemble alphaRelease
        env:
          AS_KEYSTORE_PASSWORD: ${{ secrets.AS_KEYSTORE_PASSWORD }}
          AS_KEY_ALIAS: ${{ secrets.AS_KEY_ALIAS }}
          AS_KEY_PASSWORD: ${{ secrets.AS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleAlphaRelease --stacktrace --info

      # 不上传 APK artifact：公开仓库的 Actions 产物任何登录用户都可下载，
      # 等同于公开分发安装包，违反 README 的合规口径。构建仅用于验证可编译与签名。